<!-- connect-ai-video-motion: a HyperFrames-format block (HTML + CSS + paused GSAP timeline). MIT. -->
<template id="ring-count-template">
  <div data-composition-id="ring-count" data-width="900" data-height="420" data-duration="3">
    <svg class="ring" viewBox="0 0 400 400"><circle class="track" cx="200" cy="200" r="170" /><circle class="arc" cx="200" cy="200" r="170" /></svg>
    <div class="num" data-to="12">0</div>
    <div class="unit">steps</div>
    <style>
      [data-composition-id="ring-count"] { position: relative; width: 900px; height: 420px; overflow: hidden; font-family: "Inter", "Helvetica Neue", Arial, sans-serif; }
      [data-composition-id="ring-count"] .ring { position: absolute; left: 10px; top: 10px; width: 400px; height: 400px; transform: rotate(-90deg); }
      [data-composition-id="ring-count"] .track { fill: none; stroke: rgba(235,226,210,0.18); stroke-width: 6; }
      [data-composition-id="ring-count"] .arc { fill: none; stroke: #3FB7A6; stroke-width: 10; stroke-linecap: round; }
      [data-composition-id="ring-count"] .num { position: absolute; left: 10px; top: 120px; width: 400px; text-align: center; font-size: 150px; font-weight: 200; color: #EBE2D2; font-variant-numeric: tabular-nums; line-height: 1; }
      [data-composition-id="ring-count"] .unit { position: absolute; left: 460px; top: 180px; font-size: 44px; letter-spacing: 0.28em; text-transform: uppercase; color: #F2B45A; font-weight: 400; white-space: nowrap; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/DrawSVGPlugin.min.js"></script>
    <script>
      (function () {
        gsap.registerPlugin(DrawSVGPlugin);
        var root = '[data-composition-id="ring-count"] ';
        var num = document.querySelector(root + '.num');
        var to = parseFloat(String(num.textContent).replace(/[^\d.]/g, '')) || parseFloat(num.getAttribute('data-to')) || 12;
        var tl = gsap.timeline({ paused: true });
        tl.fromTo(root + '.arc', { drawSVG: '0%' }, { drawSVG: '100%', duration: 1.6, ease: 'power2.inOut' }, 0.1);
        tl.fromTo(num, { textContent: 0 }, { textContent: to, snap: { textContent: 1 }, duration: 1.6, ease: 'power2.inOut' }, 0.1);
        tl.fromTo(root + '.unit', { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.6, ease: 'power3.out' }, 0.7);
        tl.to([root + '.ring', root + '.num', root + '.unit'], { opacity: 0, duration: 0.35, ease: 'power2.in' }, 2.6);
        window.__timelines = window.__timelines || {};
        window.__timelines['ring-count'] = tl;
      })();
    </script>
  </div>
</template>
