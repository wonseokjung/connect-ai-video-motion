<!-- connect-ai-video-motion: a HyperFrames-format block (HTML + CSS + paused GSAP timeline). MIT. -->
<template id="split-words-rise-template">
  <div data-composition-id="split-words-rise" data-width="1400" data-height="420" data-duration="3">
    <div class="line">Make it with words</div>
    <style>
      [data-composition-id="split-words-rise"] { position: relative; width: 1400px; height: 420px; overflow: hidden; font-family: "Inter", "Helvetica Neue", Arial, sans-serif; }
      [data-composition-id="split-words-rise"] .line { position: absolute; left: 40px; top: 120px; font-size: 140px; font-weight: 200; color: #EBE2D2; letter-spacing: -0.02em; white-space: nowrap; line-height: 1.15; }
      [data-composition-id="split-words-rise"] .w { display: inline-block; }
      [data-composition-id="split-words-rise"] .mask { display: inline-block; overflow: hidden; vertical-align: top; padding-bottom: 0.08em; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/SplitText.min.js"></script>
    <script>
      (function () {
        gsap.registerPlugin(SplitText);
        var root = '[data-composition-id="split-words-rise"] ';
        var split = SplitText.create(root + '.line', { type: 'words', wordsClass: 'w', mask: 'words' });
        split.words[split.words.length - 1].style.color = '#F2B45A';
        var tl = gsap.timeline({ paused: true });
        tl.from(split.words, { yPercent: 110, rotate: 4, duration: 0.8, ease: 'expo.out', stagger: 0.12 }, 0.05);
        tl.to(split.words, { yPercent: -110, duration: 0.45, ease: 'power3.in', stagger: 0.05 }, 2.45);
        window.__timelines = window.__timelines || {};
        window.__timelines['split-words-rise'] = tl;
      })();
    </script>
  </div>
</template>
