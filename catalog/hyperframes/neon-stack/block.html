<!-- connect-ai-video-motion: a HyperFrames-format block (HTML + CSS + paused GSAP timeline). MIT. -->
<template id="neon-stack-template">
  <div data-composition-id="neon-stack" data-width="1000" data-height="520" data-duration="3">
    <div class="row r1"><span class="bar"></span><span class="w l1">Tried</span></div>
    <div class="row r2"><span class="bar"></span><span class="w l2">Failed</span></div>
    <div class="row r3"><span class="bar"></span><span class="w l3">Succeeded</span></div>
    <style>
      [data-composition-id="neon-stack"] { position: relative; width: 1000px; height: 520px; overflow: hidden; font-family: "Inter", "Helvetica Neue", Arial, sans-serif; }
      [data-composition-id="neon-stack"] .row { position: absolute; left: 20px; height: 150px; display: flex; align-items: center; }
      [data-composition-id="neon-stack"] .r1 { top: 10px; } [data-composition-id="neon-stack"] .r2 { top: 180px; } [data-composition-id="neon-stack"] .r3 { top: 350px; }
      [data-composition-id="neon-stack"] .bar { display: block; width: 14px; height: 108px; border-radius: 7px; margin-right: 30px; }
      [data-composition-id="neon-stack"] .w { font-size: 128px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; white-space: nowrap; color: transparent; -webkit-background-clip: text; background-clip: text; background-size: 200% 100%; padding: 0 6px 10px 0; }
      [data-composition-id="neon-stack"] .r1 .bar { background: #22D3EE; box-shadow: 0 0 24px #22D3EE; } [data-composition-id="neon-stack"] .l1 { background-image: linear-gradient(90deg, #22D3EE, #A78BFA, #22D3EE); filter: drop-shadow(0 0 18px rgba(34,211,238,0.55)); }
      [data-composition-id="neon-stack"] .r2 .bar { background: #FB7185; box-shadow: 0 0 24px #FB7185; } [data-composition-id="neon-stack"] .l2 { background-image: linear-gradient(90deg, #FB7185, #FBBF24, #FB7185); filter: drop-shadow(0 0 18px rgba(251,113,133,0.55)); }
      [data-composition-id="neon-stack"] .r3 .bar { background: #A3E635; box-shadow: 0 0 24px #A3E635; } [data-composition-id="neon-stack"] .l3 { background-image: linear-gradient(90deg, #A3E635, #22D3EE, #A3E635); filter: drop-shadow(0 0 18px rgba(163,230,53,0.55)); }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script>
      (function () {
        var root = '[data-composition-id="neon-stack"] ';
        var tl = gsap.timeline({ paused: true });
        ['.r1', '.r2', '.r3'].forEach(function (r, i) {
          var t0 = 0.05 + i * 0.32;
          tl.fromTo(root + r + ' .bar', { scaleY: 0 }, { scaleY: 1, duration: 0.3, ease: 'back.out(3)' }, t0);
          tl.fromTo(root + r + ' .w', { clipPath: 'inset(0 100% 0 0)', x: -60, skewX: -18 }, { clipPath: 'inset(0 0% 0 0)', x: 0, skewX: 0, duration: 0.55, ease: 'expo.out' }, t0 + 0.08);
          tl.fromTo(root + r + ' .w', { backgroundPosition: '100% 0' }, { backgroundPosition: '0% 0', duration: 2.2, ease: 'none' }, t0);
        });
        tl.to(root + '.r1, ' + root + '.r2', { opacity: 0.45, duration: 0.3 }, 1.35);
        tl.fromTo(root + '.r3 .w', { scale: 1 }, { scale: 1.06, transformOrigin: '0% 50%', duration: 0.25, yoyo: true, repeat: 1, ease: 'power2.out' }, 1.35);
        tl.to(root + '.row', { opacity: 0, x: 40, duration: 0.35, stagger: 0.05, ease: 'power2.in' }, 2.6);
        window.__timelines = window.__timelines || {};
        window.__timelines['neon-stack'] = tl;
      })();
    </script>
  </div>
</template>
