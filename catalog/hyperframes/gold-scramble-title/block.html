<!-- connect-ai-video-motion: a HyperFrames-format block (HTML + CSS + paused GSAP timeline). MIT. -->
<template id="gold-scramble-title-template">
  <div data-composition-id="gold-scramble-title" data-width="1200" data-height="360" data-duration="3">
    <div class="wrap">
      <div class="kicker">CHAPTER</div>
      <div class="title">Vibe coding</div>
      <svg class="rule" viewBox="0 0 1000 20" preserveAspectRatio="none"><path d="M0 10 L1000 10" /></svg>
    </div>
    <style>
      [data-composition-id="gold-scramble-title"] { position: relative; width: 1200px; height: 360px; overflow: hidden; font-family: "Inter", "Helvetica Neue", Arial, sans-serif; }
      [data-composition-id="gold-scramble-title"] .wrap { position: absolute; left: 60px; top: 70px; }
      [data-composition-id="gold-scramble-title"] .kicker { font-size: 30px; letter-spacing: 0.32em; color: #F2B45A; font-weight: 400; opacity: 0; }
      [data-composition-id="gold-scramble-title"] .title { font-size: 128px; font-weight: 200; color: #EBE2D2; letter-spacing: -0.02em; margin-top: 10px; white-space: nowrap; }
      [data-composition-id="gold-scramble-title"] .rule { width: 1000px; height: 20px; margin-top: 18px; overflow: visible; }
      [data-composition-id="gold-scramble-title"] .rule path { stroke: #D6892A; stroke-width: 3; fill: none; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/ScrambleTextPlugin.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/DrawSVGPlugin.min.js"></script>
    <script>
      (function () {
        gsap.registerPlugin(ScrambleTextPlugin, DrawSVGPlugin);
        var root = '[data-composition-id="gold-scramble-title"] ';
        var title = document.querySelector(root + '.title');
        var text = title.textContent;
        var tl = gsap.timeline({ paused: true });
        tl.fromTo(root + '.kicker', { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.5, ease: 'power3.out' }, 0);
        tl.fromTo(title, { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0.1);
        tl.to(title, { duration: 1.1, scrambleText: { text: text, chars: 'upperAndLowerCase', revealDelay: 0.25, speed: 0.6 }, ease: 'none' }, 0.1);
        tl.fromTo(root + '.rule path', { drawSVG: '0%' }, { drawSVG: '100%', duration: 1.0, ease: 'expo.out' }, 0.35);
        tl.to(root + '.wrap', { opacity: 0, y: -16, duration: 0.35, ease: 'power2.in' }, 2.6);
        window.__timelines = window.__timelines || {};
        window.__timelines['gold-scramble-title'] = tl;
      })();
    </script>
  </div>
</template>
